version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: nexusmicro-db
    restart: always
    environment:
      POSTGRES_DB: erp_local
      POSTGRES_USER: nexus_user
      POSTGRES_PASSWORD: nexus_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: nexusmicro-redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: ./Backend
    container_name: nexusmicro-backend
    restart: always
    environment:
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=nexus_user
      - DB_PASSWORD=nexus_password
      - DB_NAME=erp_local
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=supersecretkey
    ports:
      - "3000:3000"
    depends_on:
      - db
      - redis

  frontend:
    build: ./Frontend
    container_name: nexusmicro-frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
